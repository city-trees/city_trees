#cloud-config
users:
  - name: devops
    groups: users, admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      ${ssh_authorized_keys}
package_update: true
package_upgrade: true
  - ufw
  - unzip

write_files: 
  - path: /etc/netplan/60-floating-ip.yaml
    content: |
      network:
        version: 2
        renderer: networkd
        ethernets:
          eth0:
            addresses:
            - ${floating_ip}/32    
runcmd:
  # Enable firewall
  - ufw enable

  - apt-get update
  - apt-get upgrade

  - ufw allow 2211/tcp comment 'Open port ssh tcp port 2211'

  # ssh hardening
  # @see https://www.digitalocean.com/community/tutorials/how-to-harden-openssh-on-ubuntu-20-04
  # @see https://kennethghartman.com/change-config-settings-using-a-bash-script/
  - cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak
  # Chnage ssh port to 2211
  - sed -i 's/#\?\(Port\s*\).*$/\1 2211/' /etc/ssh/sshd_config
  # Disable root login over ssh
  - sed -i 's/#\?\(PermitRootLogin\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Enable public key auth
  - sed -i 's/#\?\(PubkeyAuthentication\s*\).*$/\1 yes/' /etc/ssh/sshd_config
  # Disable empty passwords
  - sed -i 's/#\?\(PermitEmptyPasswords\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Disable password base auth 
  - sed -i 's/#\?\(PasswordAuthentication\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Set max retries to 2
  - sed -i 's/#\?\(MaxAuthTries\s*\).*$/\1 3/' /etc/ssh/sshd_config
  # Disable x11Forwarding
  - sed -i 's/#\?\(X11Forwarding\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Do not show info about last login
  - sed -i 's/#\?\(PrintLastLog\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Disable tunnel
  - sed -i 's/#\?\(PermitTunnel\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Disable agent forwards
  - sed -i 's/#\?\(AllowAgentForwarding\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Disable tcp forwards
  - sed -i 's/#\?\(AllowTcpForwarding\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Disable ChallengeResponseAuthentication
  - sed -i 's/#\?\(ChallengeResponseAuthentication\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Disable KerberosAuthentication
  - sed -i 's/#\?\(KerberosAuthentication\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Disable GSSAPIAuthentication
  - sed -i 's/#\?\(GSSAPIAuthentication\s*\).*$/\1 no/' /etc/ssh/sshd_config
  # Only allow devops user
  - sed -i '$a AllowUsers devops' /etc/ssh/sshd_config
  - systemctl reload sshd.service
  
  # Apply changes to get floating ip
  - netplan apply
  # Additional reboot to ensure that all is updated
  - reboot