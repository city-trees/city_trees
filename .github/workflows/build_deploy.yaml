name: Build and Deploy Prod

on: 
  push: 
    branches:
      - master

env:
  MIX_ENV: prod
  NODE_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/chyzwar/city_trees_buildpack:latest
    
    steps:
    - uses: actions/checkout@v2
  
    - name: Mix install
      shell: bash 
      run: mix deps.get

    - name: Compile Deps
      shell: bash
      run: mix deps.compile